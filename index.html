<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Zähler v1.2.5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ffca28; margin-bottom: 20px; }
        
        /* Gewinnsatz-Knöpfe aus v1.2.3 modifiziert */
        .settings {
            background-color: #1e1e1e;
            max-width: 500px;
            margin: 0 auto 20px auto;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn-mode {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            background-color: #424242;
            color: white;
            cursor: pointer;
        }
        .btn-mode.active {
            background-color: #ffca28;
            color: black;
        }

        .scoreboard {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto 20px auto;
        }
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 10px;
            align-items: center;
            font-size: 1.2rem;
        }
        .header { font-weight: bold; color: #9e9e9e; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .player-name { text-align: left; font-weight: bold; }
        
        .score-box {
            background: #0d0d0d;
            padding: 12px 5px;
            border-radius: 6px;
            font-size: 1.4rem;
            font-weight: bold;
        }
        .score-box.points { color: #ffca28; }
        
        .btn-container {
            display: flex;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto 20px auto;
        }
        .btn {
            flex: 1;
            padding: 35px 10px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            color: white;
        }
        .btn-rot { background-color: #d32f2f; }
        .btn-gruen { background-color: #388e3c; }
        .btn:active { opacity: 0.8; }
        
        .footer-controls { max-width: 500px; margin: 0 auto; display: flex; justify-content: space-between; }
        .btn-control { background-color: #424242; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        
        .version-tag { font-size: 0.8rem; color: #555; margin-top: 30px; }
    </style>
</head>
<body>

    <h1>Tennis Zähler</h1>

    <!-- Einfache, funktionierende Knöpfe statt blockierender Radio-Buttons -->
    <div class="settings">
        <button id="mode-2" class="btn-mode active" onclick="setTargetSets(2)">2 Gewinnsätze</button>
        <button id="mode-3" class="btn-mode" onclick="setTargetSets(3)">3 Gewinnsätze</button>
    </div>

    <div class="scoreboard">
        <div class="grid">
            <div class="header" style="text-align: left;">Team</div>
            <div class="header">Sätze</div>
            <div class="header">Spiele</div>
            <div class="header">Punkt</div>

            <div class="player-name" style="color: #ff5252;">Team Rot (+)</div>
            <div id="p1-sets" class="score-box">0</div>
            <div id="p1-games" class="score-box">0</div>
            <div id="p1-points" class="score-box points">0</div>

            <div class="player-name" style="color: #69f0ae;">Team Grün (-)</div>
            <div id="p2-sets" class="score-box">0</div>
            <div id="p2-games" class="score-box">0</div>
            <div id="p2-points" class="score-box points">0</div>
        </div>
    </div>

    <!-- Die originalen, funktionierenden Buttons aus v1.2.3 -->
    <div class="btn-container">
        <button class="btn btn-rot" onclick="pointWonBy(1)">+ Team Rot</button>
        <button class="btn btn-gruen" onclick="pointWonBy(2)">+ Team Grün</button>
    </div>

    <div class="footer-controls">
        <button class="btn-control" onclick="undoLastPoint()">↩ Undo</button>
        <button class="btn-control" onclick="resetMatch()">Reset</button>
    </div>

    <div class="version-tag">Version: v1.2.5</div>

    <script>
        let p1 = { points: 0, games: 0, sets: 0 };
        let p2 = { points: 0, games: 0, sets: 0 };
        let history = [];
        let targetSets = 2;
        let matchOver = false;
        
        const pointValues = ["0", "15", "30", "40", "Vorteil"];

        // Neue, unkomplizierte Auswahl-Logik ohne Radio-Buttons
        function setTargetSets(sets) {
            if (history.length > 0 || p1.points > 0 || p2.points > 0 || p1.games > 0 || p2.games > 0) return;
            
            targetSets = sets;
            
            document.getElementById("mode-2").className = (sets === 2) ? "btn-mode active" : "btn-mode";
            document.getElementById("mode-3").className = (sets === 3) ? "btn-mode active" : "btn-mode";
        }

        // Steuerung über Lautstärketasten (v1.2.3)
        window.addEventListener('keydown', function(event) {
            if (matchOver) return;
            if (event.key === "+" || event.key === "VolumeUp" || event.key === "ArrowUp") {
                event.preventDefault();
                pointWonBy(1);
            } else if (event.key === "-" || event.key === "VolumeDown" || event.key === "ArrowDown") {
                event.preventDefault();
                pointWonBy(2);
            }
        });

        function pointWonBy(player) {
            if (matchOver) return;

            history.push({
                p1: { points: p1.points, games: p1.games, sets: p1.sets },
                p2: { points: p2.points, games: p2.games, sets: p2.sets },
                matchOver: matchOver
            });

            // Knöpfe einfrieren, sobald gespielt wird
            document.getElementById("mode-2").disabled = true;
            document.getElementById("mode-3").disabled = true;

            let server = (player === 1) ? p1 : p2;
            let receiver = (player === 1) ? p2 : p1;

            if (server.points < 3) {
                server.points++;
            } else if (server.points === 3 && receiver.points < 3) {
                winGame(player);
                return;
            } else if (server.points === 3 && receiver.points === 3) {
                server.points = 4; 
            } else if (server.points === 3 && receiver.points === 4) {
                receiver.points = 3; 
            } else if (server.points === 4) {
                winGame(player);
                return;
            }
            updateDisplay();
        }

        function winGame(player) {
            p1.points = 0;
            p2.points = 0;

            if (player === 1) {
                p1.games++;
                if (p1.games >= 6 && (p1.games - p2.games) >= 2) {
                    winSet(1);
                    return;
                }
            } else {
                p2.games++;
                if (p2.games >= 6 && (p2.games - p1.games) >= 2) {
                    winSet(2);
                    return;
                }
            }
            updateDisplay();
        }

        function winSet(player) {
            p1.games = 0;
            p2.games = 0;
            
            if (player === 1) {
                p1.sets++;
                if (p1.sets === targetSets) { matchOver = true; alert("Match beendet! Team Rot gewinnt!"); }
            } else {
                p2.sets++;
                if (p2.sets === targetSets) { matchOver = true; alert("Match beendet! Team Grün gewinnt!"); }
            }
            updateDisplay();
        }

        function undoLastPoint() {
            if (history.length === 0) return;
            const lastState = history.pop();
            p1 = lastState.p1;
            p2 = lastState.p2;
            matchOver = lastState.matchOver;
            
            if (history.length === 0) {
                document.getElementById("mode-2").disabled = false;
                document.getElementById("mode-3").disabled = false;
            }
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById("p1-points").innerText = pointValues[p1.points] || "0";
            document.getElementById("p2-points").innerText = pointValues[p2.points] || "0";
            document.getElementById("p1-games").innerText = p1.games;
            document.getElementById("p2-games").innerText = p2.games;
            document.getElementById("p1-sets").innerText = p1.sets;
            document.getElementById("p2-sets").innerText = p2.sets;
        }

        function resetMatch() {
            if (confirm("Match zurücksetzen?")) {
                p1 = { points: 0, games: 0, sets: 0 };
                p2 = { points: 0, games: 0, sets: 0 };
                history = [];
                matchOver = false;
                document.getElementById("mode-2").disabled = false;
                document.getElementById("mode-3").disabled = false;
                setTargetSets(2);
                updateDisplay();
            }
        }

        updateDisplay();
    </script>
</body>
</html>
