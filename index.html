<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Eindeutige Version zur Cache-Kontrolle -->
    <title>Tennis Zähler v1.4.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            /* Verhindert blaue Markierungen beim Tippen */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #f59e0b;
            margin: 15px 0;
            text-transform: uppercase;
        }

        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #334155;
            text-align: center;
        }

        .title {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* Modus-Auswahl */
        .mode-switch {
            display: flex;
            gap: 10px;
        }

        .btn-mode {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #94a3b8;
            cursor: pointer;
        }

        .btn-mode.active {
            background-color: #f59e0b;
            color: #0f172a;
            border-color: #f59e0b;
        }

        /* Anzeigetafel */
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 8px;
            align-items: center;
        }

        .grid-header {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
        }

        .team-name {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: left;
        }

        .score-box {
            background-color: #0f172a;
            padding: 10px 2px;
            border-radius: 6px;
            font-size: 1.3rem;
            font-weight: bold;
            border: 1px solid #334155;
        }

        .score-box.points {
            color: #f59e0b;
            border-color: #f59e0b;
        }

        /* Große Klick-Buttons */
        .btn-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-score {
            flex: 1;
            padding: 30px 10px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            color: white;
        }

        .btn-rot { background-color: #d32f2f; }
        .btn-gruen { background-color: #388e3c; }
        .btn-score:active { opacity: 0.7; }

        /* Systemknöpfe */
        .footer-controls {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .btn-control {
            flex: 1;
            background-color: #334155;
            color: white;
            padding: 12px;
            font-size: 0.95rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-undo { background-color: #1e293b; border: 1px solid #334155; }

        .version-tag {
            font-size: 0.75rem;
            color: #475569;
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Scoreboard Pro</h1>

        <!-- Auswahl Gewinnsätze -->
        <div class="card">
            <div class="title">Match-Modus</div>
            <div class="mode-switch">
                <button id="mode-2" class="btn-mode active" onclick="setTargetSets(2)">2 Gewinnsätze</button>
                <button id="mode-3" class="btn-mode" onclick="setTargetSets(3)">3 Gewinnsätze</button>
            </div>
        </div>

        <!-- Anzeigetafel -->
        <div class="card">
            <div class="grid">
                <div class="grid-header" style="text-align: left;">Team</div>
                <div class="grid-header">Sätze</div>
                <div class="grid-header">Spiele</div>
                <div class="grid-header">Punkt</div>

                <!-- Reihe Team Rot -->
                <div class="team-name" style="color: #ef4444;">Team Rot</div>
                <div id="p1-sets" class="score-box">0</div>
                <div id="p1-games" class="score-box">0</div>
                <div id="p1-points" class="score-box points">0</div>

                <!-- Reihe Team Grün -->
                <div class="team-name" style="color: #10b981;">Team Grün</div>
                <div id="p2-sets" class="score-box">0</div>
                <div id="p2-games" class="score-box">0</div>
                <div id="p2-points" class="score-box points">0</div>
            </div>
        </div>

        <!-- Große Zählbuttons -->
        <div class="btn-container">
            <button class="btn-score btn-rot" onclick="pointWonBy(1)">+ Team Rot</button>
            <button class="btn-score btn-gruen" onclick="pointWonBy(2)">+ Team Grün</button>
        </div>

        <!-- Systemtasten -->
        <div class="footer-controls">
            <button class="btn-control btn-undo" onclick="undoLastPoint()">↩ Undo</button>
            <button class="btn-control" onclick="resetMatch()">Reset</button>
        </div>
        
        <div class="version-tag">VERSION: v1.4.0</div>
    </div>

    <script>
        let p1 = { points: 0, games: 0, sets: 0 };
        let p2 = { points: 0, games: 0, sets: 0 };
        let history = [];
        let targetSets = 2;
        let matchOver = false;
        let modeLocked = false;
        
        const pointValues = ["0", "15", "30", "40", "Vorteil"];

        function setTargetSets(sets) {
            if (modeLocked) return;
            
            targetSets = sets;
            
            const btn2 = document.getElementById("mode-2");
            const btn3 = document.getElementById("mode-3");
            
            if (sets === 2) {
                btn2.className = "btn-mode active";
                btn3.className = "btn-mode";
            } else {
                btn2.className = "btn-mode";
                btn3.className = "btn-mode active";
            }
        }

        // Steuerung über Lautstärketasten
        window.addEventListener('keydown', function(event) {
            if (matchOver) return;
            if (event.key === "+" || event.key === "VolumeUp" || event.key === "ArrowUp") {
                event.preventDefault();
                pointWonBy(1);
            } else if (event.key === "-" || event.key === "VolumeDown" || event.key === "ArrowDown") {
                event.preventDefault();
                pointWonBy(2);
            }
        });

        function pointWonBy(player) {
            if (matchOver) return;

            // Auswahl einfrieren
            modeLocked = true;
            document.getElementById("mode-2").style.opacity = "0.3";
            document.getElementById("mode-3").style.opacity = "0.3";

            history.push({
                p1: { points: p1.points, games: p1.games, sets: p1.sets },
                p2: { points: p2.points, games: p2.games, sets: p2.sets },
                modeLocked: modeLocked
            });

            let server = (player === 1) ? p1 : p2;
            let receiver = (player === 1) ? p2 : p1;

            if (server.points < 3) {
                server.points++;
            } else if (server.points === 3 && receiver.points < 3) {
                winGame(player);
                return;
            } else if (server.points === 3 && receiver.points === 3) {
                server.points = 4; // Vorteil
            } else if (server.points === 3 && receiver.points === 4) {
                receiver.points = 3; // Einstand
            } else if (server.points === 4) {
                winGame(player);
                return;
            }
            updateDisplay();
        }

        function winGame(player) {
            p1.points = 0;
            p2.points = 0;

            if (player === 1) {
                p1.games++;
                if (p1.games >= 6 && (p1.games - p2.games) >= 2) {
                    winSet(1);
                    return;
                }
            } else {
                p2.games++;
                if (p2.games >= 6 && (p2.games - p1.games) >= 2) {
                    winSet(2);
                    return;
                }
            }
            updateDisplay();
        }

        function winSet(player) {
            p1.games = 0;
            p2.games = 0;
            
            if (player === 1) {
                p1.sets++;
                if (p1.sets === targetSets) { matchOver = true; alert("Match beendet! Team Rot gewinnt!"); }
            } else {
                p2.sets++;
                if (p2.sets === targetSets) { matchOver = true; alert("Match beendet! Team Grün gewinnt!"); }
            }
            updateDisplay();
        }

        function undoLastPoint() {
            if (history.length === 0) return;
            const lastState = history.pop();
            p1 = lastState.p1;
            p2 = lastState.p2;
            modeLocked = lastState.modeLocked;
