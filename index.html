<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Cache-Kontrolltitel -->
    <title>Tennis Zähler v1.4.2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            /* Erzwingt, dass Touch-Events auf absolut allen Elementen durchgelassen werden */
            pointer-events: auto !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #f59e0b;
            margin: 15px 0;
            text-transform: uppercase;
        }

        /* Diagnose-Anzeige */
        .debug-console {
            background-color: #7f1d1d;
            color: #fca5a5;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-family: monospace;
            font-size: 0.85rem;
            text-align: left;
            border: 2px solid #ef4444;
            display: none;
        }

        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #334155;
            text-align: center;
        }

        .title {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .mode-switch {
            display: flex;
            gap: 10px;
        }

        .btn-mode {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #94a3b8;
            cursor: pointer;
        }

        .btn-mode.active {
            background-color: #f59e0b;
            color: #0f172a;
            border-color: #f59e0b;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 8px;
            align-items: center;
        }

        .grid-header {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
        }

        .team-name {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: left;
        }

        .score-box {
            background-color: #0f172a;
            padding: 10px 2px;
            border-radius: 6px;
            font-size: 1.3rem;
            font-weight: bold;
            border: 1px solid #334155;
        }

        .score-box.points {
            color: #f59e0b;
            border-color: #f59e0b;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        /* Optimierte Score-Buttons mit aggressiver Feedback-Farbe */
        .btn-score {
            flex: 1;
            padding: 35px 10px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            color: white;
        }

        .btn-rot { background-color: #d32f2f; }
        .btn-gruen { background-color: #388e3c; }
        
        /* Radikaler Farbwechsel beim Antippen zur visuellen Kontrolle */
        .btn-rot:active, .btn-rot:focus { background-color: #f59e0b !important; color: #0f172a !important; }
        .btn-gruen:active, .btn-gruen:focus { background-color: #f59e0b !important; color: #0f172a !important; }
        .btn-mode:active { background-color: #f59e0b !important; color: #0f172a !important; }

        .footer-controls {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .btn-control {
            flex: 1;
            background-color: #334155;
            color: white;
            padding: 12px;
            font-size: 0.95rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-undo { background-color: #1e293b; border: 1px solid #334155; }
        .btn-control:active { background-color: #f59e0b !important; color: #0f172a !important; }

        .version-tag {
            font-size: 0.75rem;
            color: #475569;
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Scoreboard Pro</h1>

        <!-- Fehler-Log -->
        <div id="error-log" class="debug-console"></div>

        <!-- Sätze-Auswahl -->
        <div class="card">
            <div class="title">Match-Modus</div>
            <div class="mode-switch">
                <button id="mode-2" class="btn-mode active" onclick="setTargetSets(2)" ontouchstart="setTargetSets(2)">2 Gewinnsätze</button>
                <button id="mode-3" class="btn-mode" onclick="setTargetSets(3)" ontouchstart="setTargetSets(3)">3 Gewinnsätze</button>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="card">
            <div class="grid">
                <div class="grid-header" style="text-align: left;">Team</div>
                <div class="grid-header">Sätze</div>
                <div class="grid-header">Spiele</div>
                <div class="grid-header">Punkt</div>

                <div class="team-name" style="color: #ef4444;">Team Rot</div>
                <div id="p1-sets" class="score-box">0</div>
                <div id="p1-games" class="score-box">0</div>
                <div id="p1-points" class="score-box points">0</div>

                <div class="team-name" style="color: #10b981;">Team Grün</div>
                <div id="p2-sets" class="score-box">0</div>
                <div id="p2-games" class="score-box">0</div>
                <div id="p2-points" class="score-box points">0</div>
            </div>
        </div>

        <!-- Haupttasten -->
        <div class="btn-container">
            <button class="btn-score btn-rot" onclick="pointWonBy(1)" ontouchstart="pointWonBy(1)">+ Team Rot</button>
            <button class="btn-score btn-gruen" onclick="pointWonBy(2)" ontouchstart="pointWonBy(2)">+ Team Grün</button>
        </div>

        <!-- Utility-Tasten -->
        <div class="footer-controls">
            <button class="btn-control btn-undo" onclick="undoLastPoint()" ontouchstart="undoLastPoint()">↩ Undo</button>
            <button class="btn-control" onclick="resetMatch()" ontouchstart="resetMatch()">Reset</button>
        </div>
        
        <div class="version-tag">VERSION: v1.4.2</div>
    </div>

    <script>
        window.onerror = function(msg, url, line) {
            const log = document.getElementById("error-log");
            log.style.display = "block";
            log.innerText = "FEHLER: " + msg + "\nZeile: " + line;
            return false;
        };

        let p1 = { points: 0, games: 0, sets: 0 };
        let p2 = { points: 0, games: 0, sets: 0 };
        let history = [];
        let targetSets = 2;
        let matchOver = false;
        let modeLocked = false;
        
        const pointValues = ["0", "15", "30", "40", "Vorteil"];

        function setTargetSets(sets) {
            if (modeLocked) return;
            targetSets = sets;
            
            document.getElementById("mode-2").className = (sets === 2) ? "btn-mode active" : "btn-mode";
            document.getElementById("mode-3").className = (sets === 3) ? "btn-mode active" : "btn-mode";
        }

        function pointWonBy(player) {
            if (matchOver) return;

            modeLocked = true;
            document.getElementById("mode-2").style.opacity = "0.3";
            document.getElementById("mode-3").style.opacity = "0.3";

            history.push({
                p1: { points: p1.points, games: p1.games, sets: p1.sets },
                p2: { points: p2.points, games: p2.games, sets: p2.sets },
                modeLocked: modeLocked
            });

            let server = (player === 1) ? p1 : p2;
            let receiver = (player === 1) ? p2 : p1;

            if (server.points < 3) {
                server.points++;
            } else if (server.points === 3 && receiver.points < 3) {
                winGame(player);
                return;
            } else if (server.points === 3 && receiver.points === 3) {
                server.points = 4; 
            } else if (server.points === 3 && receiver.points === 4) {
                receiver.points = 3; 
            } else if (server.points === 4) {
                winGame(player);
                return;
            }
            updateDisplay();
        }

        function winGame(player) {
            p1.points = 0;
            p2.points = 0;

            if (player === 1) {
                p1.games++;
                if (p1.games >= 6 && (p1.games - p2.games) >= 2) {
                    winSet(1);
                    return;
                }
            } else {
                p2.games++;
                if (p2.games >= 6 && (p2.games - p1.games) >= 2) {
                    winSet(2);
                    return;
                }
            }
            updateDisplay();
        }

        function winSet(player) {
            p1.games = 0;
            p2.games = 0;
            
            if (player === 1) {
                p1.sets++;
