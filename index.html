<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Versionsnummer im Titel zur Cache-Kontrolle -->
    <title>Tennis Score Pro v1.3.2</title>
    <style>
        :root {
            --bg-main: #0f172a;       
            --bg-card: #1e293b;       
            --accent-yellow: #f59e0b; 
            --team-red: #ef4444;      
            --team-green: #10b981;    
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Der korrigierte Hauptcontainer, der alle Elemente sauber umschließt */
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-yellow);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 10px 0 5px 0;
        }

        /* Modus-Auswahl */
        .settings-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #334155;
            text-align: center;
        }

        .settings-title {
            font-size: 0.85rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .mode-switch {
            display: flex;
            gap: 12px;
        }

        .btn-mode {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            border: 2px solid #334155;
            border-radius: 10px;
            background-color: #0f172a;
            color: var(--text-dim);
            cursor: pointer;
        }

        .btn-mode.active {
            background-color: var(--accent-yellow);
            color: #0f172a;
            border-color: var(--accent-yellow);
        }

        /* Anzeigetafel */
        .scoreboard {
            background-color: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #334155;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 10px;
            align-items: center;
        }

        .grid-header {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
            text-align: center;
        }
        .grid-header.team-col { text-align: left; }

        .team-row {
            font-size: 1.2rem;
            font-weight: 800;
            text-align: left;
        }

        .score-box {
            background: #0f172a;
            padding: 12px 5px;
            border-radius: 8px;
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            border: 1px solid #334155;
        }
        .score-box.points {
            color: var(--accent-yellow);
            font-size: 1.6rem;
            border-color: var(--accent-yellow);
        }

        /* Große Klick-Buttons */
        .btn-container {
            display: flex;
            gap: 16px;
        }

        .btn-score {
            flex: 1;
            padding: 35px 10px;
            font-size: 1.4rem;
            font-weight: 800;
            cursor: pointer;
            border: none;
            border-radius: 14px;
            color: white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .btn-rot { background-color: #d32f2f; }
        .btn-gruen { background-color: #388e3c; }
        .btn-score:active { opacity: 0.7; }

        /* Footer Steuerungen */
        .footer-controls {
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        .btn-control {
            flex: 1;
            background-color: #334155;
            color: var(--text-light);
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-undo { background-color: #1e293b; border: 1px solid #334155; }

        .version-tag {
            font-size: 0.75rem;
            color: #475569;
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Start des umschließenden Containers -->
    <div class="container">
        <h1>Scoreboard Pro</h1>

        <!-- Auswahl der Gewinnsätze -->
        <div class="settings-card">
            <div class="settings-title">Match-Modus Festlegen</div>
            <div class="mode-switch">
                <button id="mode-2" class="btn-mode active" onclick="setTargetSets(2)">2 Gewinnsätze</button>
                <button id="mode-3" class="btn-mode" onclick="setTargetSets(3)">3 Gewinnsätze</button>
            </div>
        </div>

        <!-- Anzeigetafel -->
        <div class="scoreboard">
            <div class="grid">
                <div class="grid-header team-col">Team</div>
                <div class="grid-header">Sätze</div>
                <div class="grid-header">Spiele</div>
                <div class="grid-header">Punkt</div>

                <!-- Reihe Team Rot -->
                <div class="team-row" style="color: var(--team-red);">Team Rot</div>
                <div id="p1-sets" class="score-box">0</div>
                <div id="p1-games" class="score-box">0</div>
                <div id="p1-points" class="score-box points">0</div>

                <!-- Reihe Team Grün -->
                <div class="team-row" style="color: var(--team-green);">Team Grün</div>
                <div id="p2-sets" class="score-box">0</div>
                <div id="p2-games" class="score-box">0</div>
                <div id="p2-points" class="score-box points">0</div>
            </div>
        </div>

        <!-- Zähl-Buttons -->
        <div class="btn-container">
            <button class="btn-score btn-rot" onclick="pointWonBy(1)">+ Team Rot</button>
            <button class="btn-score btn-gruen" onclick="pointWonBy(2)">+ Team Grün</button>
        </div>

        <!-- Systemknöpfe -->
        <div class="footer-controls">
            <button class="btn-control btn-undo" onclick="undoLastPoint()">↩ Undo</button>
            <button class="btn-control" onclick="resetMatch()">Reset</button>
        </div>
        
        <div class="version-tag">VERSION: v1.3.2</div>
    </div> <!-- Ende des Containers -->

    <script>
        let p1 = { points: 0, games: 0, sets: 0 };
        let p2 = { points: 0, games: 0, sets: 0 };
        let history = [];
        let targetSets = 2;
        let matchOver = false;
        let modeLocked = false;
        
        const pointValues = ["0", "15", "30", "40", "Vorteil"];

        function setTargetSets(sets) {
            if (modeLocked) return;
            
            targetSets = sets;
            
            const btn2 = document.getElementById("mode-2");
            const btn3 = document.getElementById("mode-3");
            
            if (sets === 2) {
                btn2.className = "btn-mode active";
                btn3.className = "btn-mode";
            } else {
                btn2.className = "btn-mode";
                btn3.className = "btn-mode active";
            }
        }

        // Steuerung über Hardware-Lautstärketasten (+ / -)
        window.addEventListener('keydown', function(event) {
            if (matchOver) return;
            if (event.key === "+" || event.key === "VolumeUp" || event.key === "ArrowUp") {
                event.preventDefault();
                pointWonBy(1);
            } else if (event.key === "-" || event.key === "VolumeDown" || event.key === "ArrowDown") {
                event.preventDefault();
                pointWonBy(2);
            }
        });

        function pointWonBy(player) {
            if (matchOver) return;

            // Spielmodus einfrieren bei Spielbeginn
            modeLocked = true;
            document.getElementById("mode-2").style.opacity = "0.4";
            document.getElementById("mode-3").style.opacity = "0.4";

            // Historie sichern
            history.push({
                p1: { points: p1.points, games: p1.games, sets: p1.sets },
                p2: { points: p2.points, games: p2.games, sets: p2.sets },
                modeLocked: modeLocked
            });

            let server = (player === 1) ? p1 : p2;
            let receiver = (player === 1) ? p2 : p1;

            if (server.points < 3) {
                server.points++;
            } else if (server.points === 3 && receiver.points < 3) {
                winGame(player);
                return;
            } else if (server.points === 3 && receiver.points === 3) {
                server.points = 4; // Vorteil
            } else if (server.points === 3 && receiver.points === 4) {
                receiver.points = 3; // Zurück zu Einstand
            } else if (server.points === 4) {
                winGame(player);
                return;
            }
            updateDisplay();
