<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tennis Zähler (Repariert und Bereinigt)</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }
        body {
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            text-align: center;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }
        h1 { 
            margin: 5px 0 10px 0; 
            font-size: 1.8rem; 
            color: #ffca28; 
        }
        
        .match-settings {
            background-color: #1e1e1e;
            max-width: 600px;
            margin: 0 auto 10px auto;
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            border: 1px solid #333;
        }
        .match-settings label {
            margin: 0 15px;
            font-size: 1.1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }
        .match-settings input {
            margin-right: 8px;
            transform: scale(1.3);
        }

        .voice-panel {
            background-color: #212121;
            max-width: 600px;
            margin: 0 auto 10px auto;
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            border: 1px solid #424242;
        }
        .btn-voice {
            background-color: #ffca28;
            color: black;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 5px;
        }
        .btn-voice.listening {
            background-color: #0288d1;
            color: white;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        #voice-status {
            font-size: 0.9rem;
            color: #ffca28;
            margin-top: 5px;
            font-style: italic;
        }

        .scoreboard {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            max-width: 600px;
            margin: 0 auto auto auto;
            width: 100%;
            border: 1px solid #333;
        }
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 8px;
            align-items: center;
        }
        .header { 
            font-weight: bold; 
            color: #9e9e9e; 
            border-bottom: 2px solid #333; 
            padding-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .player-name { 
            text-align: left; 
            font-weight: bold; 
            font-size: 1.2rem;
        }
        .score-box {
            background: #0d0d0d;
            padding: 12px 5px;
            border-radius: 6px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #e0e0e0;
            border: 1px solid #333;
        }
        .score-box.points { 
            color: #ffca28; 
            font-size: 1.6rem;
            border-color: #ffca28;
        }
        
        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            max-width: 600px;
            margin: 15px auto 0 auto;
            width: 100%;
        }
        .btn {
            flex: 1;
            padding: 30px 10px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 14px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }
        .btn-rot { background-color: #d32f2f; color: white; }
        .btn-rot:active { background-color: #b71c1c; }
        
        .btn-gruen { background-color: #388e3c; color: white; }
        .btn-gruen:active { background-color: #1b5e20; }
        
        .btn-disabled { opacity: 0.15; pointer-events: none; }
        
        .footer-controls {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            max-width: 600px;
            margin: 10px auto 0 auto;
            width: 100%;
        }
        .btn-control {
            background-color: #424242;
            color: #fff;
            padding: 12px 20px;
            font-size: 0.95rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-undo { background-color: #616161; }
    </style>
</head>
<body>

    <div>
        <h1>Tennis Zähler</h1>

        <div class="match-settings">
            <label>
                <input type="radio" name="matchMode" value="2" checked onchange="updateRequiredSets()"> 2 Gewinnsätze
            </label>
            <label>
                <input type="radio" name="matchMode" value="3" onchange="updateRequiredSets()"> 3 Gewinnsätze
            </label>
        </div>

        <div class="voice-panel">
            <strong>🎤 Intelligente Sprachsteuerung</strong><br>
            <button id="btn-voice" class="btn-voice" onclick="toggleVoiceRecognition()">Spracherkennung starten</button>
            <div id="voice-status">Inaktiv (Befehle: "Rot", "Grün", "Brot")</div>
        </div>

        <div class="scoreboard">
            <div class="grid">
                <div class="header" style="text-align: left;">Team</div>
                <div class="header">Sätze</div>
                <div class="header">Spiele</div>
                <div class="header">Punkt</div>

                <!-- Team Rot -->
                <div class="player-name" style="color: #ff5252;">Team Rot (+)</div>
                <div id="p1-sets" class="score-box">0</div>
                <div id="p1-games" class="score-box">0</div>
                <div id="p1-points" class="score-box points">0</div>

                <!-- Team Grün -->
                <div class="player-name" style="color: #69f0ae;">Team Grün (-)</div>
                <div id="p2-sets" class="score-box">0</div>
                <div id="p2-games" class="score-box">0</div>
                <div id="p2-points" class="score-box points">0</div>
            </div>
        </div>
    </div>

    <div>
        <div class="btn-container">
            <button id="btn-p1" class="btn btn-rot" onclick="pointWonBy(1)">+ Punkt<br>Team Rot</button>
            <button id="btn-p2" class="btn btn-gruen" onclick="pointWonBy(2)">+ Punkt<br>Team Grün</button>
        </div>

        <div class="footer-controls">
            <button class="btn-control btn-undo" onclick="undoLastPoint()">↩ Undo</button>
            <button class="btn-control" onclick="resetMatch()">Reset</button>
        </div>
    </div>

    <script>
        let p1 = { points: 0, games: 0, sets: 0 };
        let p2 = { points: 0, games: 0, sets: 0 };
        let history = [];
        let targetSets = 2;
        let matchOver = false;
        let isListening = false;
        let recognition = null;
        
        const pointValues = ["0", "15", "30", "40", "Vorteil"];

        const keywordsRot = ["rot", "brot", "boot", "kot", "not", "rod", "tod", "dot", "root", "road"];
        const keywordsGruen = ["grün", "gruen", "früh", "brüh", "kien", "gryn", "dünn", "grien", "queen"];
        const keywordsUndo = ["zurück", "zuruck", "rückgängig", "undo", "fehler", "stop", "nein"];

        function updateRequiredSets() {
            const el = document.querySelector('input[name="matchMode"]:checked');
            if(el) targetSets = parseInt(el.value);
        }

        window.addEventListener('keydown', function(event) {
            if (matchOver) return;
            if (event.key === "+" || event.key === "VolumeUp" || event.key === "ArrowUp" || event.key === "ArrowRight") {
                event.preventDefault();
                pointWonBy(1);
            }
            else if (event.key === "-" || event.key === "VolumeDown" || event.key === "ArrowDown" || event.key === "ArrowLeft") {
                event.preventDefault();
                pointWonBy(2);
            }
        });

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const resultIndex = event.resultIndex;
                const text = event.results[resultIndex].transcript.toLowerCase().trim();
                document.getElementById("voice-status").innerText = `Geheard: "${text}"`;

                if (matchOver) return;

                const gehörtRot = keywordsRot.some(word => text.includes(word));
                const gehörtGruen = keywordsGruen.some(word => text.includes(word));
                const gehörtUndo = keywordsUndo.some(word => text.includes(word));

                if (gehörtRot) {
                    pointWonBy(1);
                } else if (gehörtGruen) {
                    pointWonBy(2);
                } else if (gehörtUndo) {
                    undoLastPoint();
                }
            };

            recognition.onerror = function() {
